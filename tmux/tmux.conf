# -------------------------------------------------------------
# General Settings
# -------------------------------------------------------------
# Remap prefix from 'Ctrl-b' to 'Ctrl-t' (easier to reach)
unbind C-b
set -g prefix C-t
bind C-t send-prefix

# Enable true color support and mouse control
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:Tc"
set -g mouse on

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reduce escape time delay (essential for responsive Vim mode switching)
set -s escape-time 0

# -------------------------------------------------------------
# Keybindings
# -------------------------------------------------------------
# Intuitive splits using | and - (and preserve current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Open new windows in current working directory
bind c new-window -c "#{pane_current_path}"

# Navigate panes using Vim Dvorak directions (Prefix + h/t/n/s)
bind h select-pane -L
bind t select-pane -D
bind n select-pane -U
bind s select-pane -R

# Quick reload of config with Prefix + r
bind r source-file ~/.tmux.conf \; display-message "=> Tmux config reloaded!"

